repos:
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: 8ebb1eb700c8785f2ee97c25259a3f24b74a4dcf # frozen: v1.89.0
    hooks:
      - id: oxlint
        verbose: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
        exclude: |
          (?x)^(
          )$
      - id: check-ast
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: detect-private-key
        exclude: |
          (?x)^(
          )$
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
          )$
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: file-contents-sorter
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: name-tests-test
      - id: requirements-txt-fixer
      - id: sort-simple-yaml
      - id: trailing-whitespace
      - id: pretty-format-json
        args:
          - --autofix
        exclude: |
          (?x)^(
          )$
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724 # frozen: v9.27.0
    hooks:
      - id: commitlint
        language: node
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
